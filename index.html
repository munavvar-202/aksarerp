, "narxi (1 kg)": ["цена (1 кг)", "price (1 kg)"], "izoh": ["примечание", "note"], "Kamida bitta eniga og'irlik yozing.": ["Укажите вес хотя бы для одной ширины.", "Enter a weight for at least one width."], "Zaxira": ["Резерв", "Backup"], "Zaxira nusxa": ["Резервная копия", "Backup"], "Zaxira nusxani yuklab olish": ["Скачать резервную копию", "Download backup"], "Bazadagi hamma ma'lumot (zakazlar, harakatlar, mato, tikuv, ishchilar, xodimlar, sozlamalar) bitta faylga yoziladi. Haftada kamida bir marta oling va faylni kompyuterdan tashqari joyda ham saqlang (fleshka, Telegram, Google Drive).": ["Все данные базы (заказы, движения, ткань, пошив, рабочие, сотрудники, настройки) записываются в один файл. Делайте копию хотя бы раз в неделю и храните файл не только на компьютере (флешка, Telegram, Google Drive).", "All database data (orders, movements, fabric, sewing, workers, staff, settings) is written to one file. Take one at least weekly and keep the file somewhere besides this computer (USB stick, Telegram, Google Drive)."], "Oxirgi zaxira: ": ["Последняя копия: ", "Last backup: "], "hali olinmagan": ["ещё не делалась", "not taken yet"], "bugun": ["сегодня", "today"], "yuklanmoqda…": ["загрузка…", "loading…"], "Zaxiradan tiklash": ["Восстановление из копии", "Restore from backup"], "Fayldagi yozuvlar bazaga qaytariladi: bazada bor yozuv fayldagi holatiga qaytadi, yo'qolgani qayta yoziladi. Zaxiradan keyin qo'shilgan yozuvlar o'chirilmaydi.": ["Записи из файла возвращаются в базу: существующие возвращаются к состоянию файла, пропавшие записываются заново. Записи, добавленные после копии, не удаляются.", "Records from the file are written back: existing ones revert to the file's state, missing ones are recreated. Records added after the backup are not deleted."], "Zaxira faylini tanlash": ["Выбрать файл копии", "Choose backup file"], "Tiklash": ["Восстановить", "Restore"], "Ha, tiklash": ["Да, восстановить", "Yes, restore"], "Tiklanmoqda…": ["Восстановление…", "Restoring…"], "Ishonchingiz komilmi? Bazadagi yozuvlar fayldagi holatga qaytadi.": ["Вы уверены? Записи в базе вернутся к состоянию файла.", "Are you sure? Database records will revert to the file's state."], "O'chirilganlar": ["Удалённые", "Deleted"], "Qaytarish": ["Вернуть", "Restore"], "qaytarildi": ["возвращено", "restored"], "Qachon": ["Когда", "When"], "Nima": ["Что", "What"], "Kim nimani qachon o'chirgani shu yerda 180 kun saqlanadi. Zakaz qaytarilsa, u bilan birga o'chgan harakatlari ham qaytadi.": ["Здесь 180 дней хранится, кто что и когда удалил. При возврате заказа возвращаются и удалённые вместе с ним движения.", "Who deleted what and when is kept here for 180 days. Restoring an order also restores the movements deleted with it."], "Hali hech narsa o'chirilmagan": ["Пока ничего не удалялось", "Nothing has been deleted yet"], "Bazaga zaxira.sql hali qo'shilmagan. Supabase → SQL Editor'da zaxira.sql faylini bir marta ishga tushiring.": ["В базу ещё не добавлен zaxira.sql. Запустите файл zaxira.sql один раз в Supabase → SQL Editor.", "zaxira.sql has not been added to the database yet. Run zaxira.sql once in Supabase → SQL Editor."], "Bazaga zaxira.sql hali qo'shilmagan.": ["В базу ещё не добавлен zaxira.sql.", "zaxira.sql has not been added to the database yet."], "Zaxira nusxa hali olinmagan. «Zaxira» bo'limidan yuklab oling.": ["Резервная копия ещё не делалась. Скачайте её в разделе «Резерв».", "No backup has been taken yet. Download one in the “Backup” section."], "Harakat": ["Движение", "Movement"], "Sozlama": ["Настройка", "Setting"], "Ishchi": ["Рабочий", "Worker"], "Tikuv modeli": ["Модель пошива", "Sewing model"], "Skan": ["Скан", "Scan"], "Ish kunlari": ["Рабочие дни", "Work days"], "Korobka sanog'i": ["Счётчик коробок", "Box counter"], "Korobka raqami": ["Номер коробки", "Box number"], "Xodim": ["Сотрудник", "Staff member"], "Mato kirim": ["Приход ткани", "Fabric receipt"], "Mato brak": ["Брак ткани", "Fabric defect"], "yoki .xlsx / .pdf faylni shu yerga tashlang": ["или перетащите сюда файл .xlsx / .pdf", "or drop an .xlsx / .pdf file here"], "PDF ochilmoqda…": ["Открываем PDF…", "Opening PDF…"], "PDF ichidagi jadval rasmdan o'qilmoqda. Birinchi marta o'qish dasturi internetdan yuklanadi, keyingi safar tezroq bo'ladi.": ["Таблица в PDF распознаётся с изображения. В первый раз программа распознавания загружается из интернета, дальше будет быстрее.", "The table in the PDF is being read from the image. The first time, the recognition program downloads from the internet; later runs are faster."], "PDF ichidagi jadval rasmdan o'qilmoqda. Birinchi marta o'qish dasturi internetdan yuklanadi.": ["Таблица в PDF распознаётся с изображения. В первый раз программа распознавания загружается из интернета.", "The table in the PDF is being read from the image. The first time, the recognition program downloads from the internet."], "PDF'ni faqat saytda o'qish mumkin.": ["PDF можно прочитать только на сайте.", "PDFs can only be read on the website."], "PDF'da \"Tayyor mahsulot\" (rang va razmer) jadvali topilmadi.": ["В PDF не найдена таблица «Tayyor mahsulot» (цвета и размеры).", "No “Tayyor mahsulot” (colour and size) table found in the PDF."], "PDF o'qildi: zakaz soni va mato ehtiyoji. Tekshirib, saqlang.": ["PDF прочитан: количество заказа и потребность в ткани. Проверьте и сохраните.", "PDF read: order quantities and fabric requirement. Check and save."], "PDF o'qildi: zakaz soni. Mato sahifasi topilmadi.": ["PDF прочитан: количество заказа. Страница ткани не найдена.", "PDF read: order quantities. Fabric page not found."], "PDF'ni o'qishda farq topildi, shu joylarni PDF bilan solishtiring:": ["При чтении PDF найдены расхождения, сверьте эти места с PDF:", "Differences found while reading the PDF; compare these with the PDF:"], "PDF'dan o'qildi. Har bir rang qatori va razmer ustuni PDF'dagi \"Jami\" bilan solishtirildi: mos keldi.": ["Прочитано из PDF. Каждая строка цвета и столбец размера сверены с «Jami» в PDF: совпадает.", "Read from the PDF. Every colour row and size column was checked against the PDF's “Jami”: they match."], "Mato ehtiyoji (PDF 2-sahifa)": ["Потребность в ткани (PDF, стр. 2)", "Fabric requirement (PDF page 2)"], "Mato jadvalida farq topildi:": ["В таблице ткани найдены расхождения:", "Differences in the fabric table:"], "Har bir rang bo'yicha enlar yig'indisi PDF'dagi \"Bo'yalgan, kg\" bilan solishtirildi: mos keldi.": ["Сумма по ширинам для каждого цвета сверена с «Bo'yalgan, kg» в PDF: совпадает.", "Each colour's width total was checked against the PDF's “Bo'yalgan, kg”: they match."], "Zakaz bilan birga mato ehtiyojini ham saqlash (Mato ombori → Zakaz ehtiyoji)": ["Сохранить вместе с заказом и потребность в ткани (Склад ткани → Потребность заказа)", "Also save the fabric requirement with the order (Fabric stock → Order requirement)"], "PDF'da aniq o'qilmadi, tekshiring": ["В PDF прочитано неуверенно, проверьте", "Not read clearly from the PDF, please check"], "PDF'da \"Bo'yalgan mato zakazi\" jadvali topilmadi.": ["В PDF не найдена таблица «Bo'yalgan mato zakazi».", "No “Bo'yalgan mato zakazi” table found in the PDF."], "Bo'yoqxona: ": ["Красильня: ", "Dye house: "], "Zakaz uchun qaysi rang va enidan qancha mato kerakligini yozing yoki zakaz faylidan (Excel yoki PDF) o'qing.": ["Укажите, сколько ткани какого цвета и ширины нужно на заказ, или считайте из файла заказа (Excel или PDF).", "Enter how much fabric of each colour and width the order needs, or read it from the order file (Excel or PDF)."], "Kamomad": ["Недостача", "Shortage"], "Zakaz ehtiyojiga yetmay kelgan mato: kerak (ehtiyoj) − kelgan sof mato. Brak mato kelgandan ayrilgan.": ["Ткань, пришедшая меньше потребности заказа: нужно (потребность) − пришедшая чистая ткань. Брак вычтен из пришедшего.", "Fabric that arrived short of the order requirement: required − net fabric received. Defects are subtracted from what arrived."], "Ortiqcha kelganlarini ham ko'rsatish": ["Показать и излишки", "Also show excess"], "Kam kelgan, kg": ["Недопоставлено, кг", "Short, kg"], "Kamomadli zakazlar": ["Заказы с недостачей", "Orders with shortage"], "Ortiqcha kelgan, kg": ["Излишек, кг", "Excess, kg"], "Kamomad yo'q: hamma zakazlarga ehtiyojicha mato kelgan.": ["Недостачи нет: по всем заказам ткань пришла по потребности.", "No shortage: every order received its required fabric."], "Zakazlar bo'yicha kamomad": ["Недостача по заказам", "Shortage by order"], "Farq, kg": ["Разница, кг", "Difference, kg"], "Har bir zakaz uchun rang va eni bo'yicha kelgan sof mato miqdorida bitta \"Bichuvga berildi\" yozuvi qilinadi (qo'lda kiritilgan chiqim va brak hisobga olinadi). Bazada yo'q yoki faqat mato uchun ochilgan zakazlar omborda qoladi.": ["Для каждого заказа создаётся одна запись «Выдано в раскрой» на количество пришедшей чистой ткани по цвету и ширине (ручные выдачи и брак учитываются). Заказы, которых нет в базе или открытые только для ткани, остаются на складе.", "For each order one “Issued to cutting” record is made for the net fabric received per colour and width (manual issues and defects are taken into account). Orders not in the database, or opened only for fabric, stay in stock."], "Har bir zakaz uchun rang va eni bo'yicha Excel'dagi kelgan sof mato miqdorida bitta \"Bichuvga berildi\" yozuvi qilinadi. Saytda qo'lda kiritilgan kirimlar bunga kirmaydi va omborda qoladi. Bazada yo'q yoki faqat mato uchun ochilgan zakazlar ham omborda qoladi.": ["Для каждого заказа создаётся одна запись «Выдано в раскрой» на количество чистой ткани из Excel по цвету и ширине. Приходы, введённые на сайте вручную, сюда не входят и остаются на складе. Заказы, которых нет в базе или открытые только для ткани, тоже остаются на складе.", "For each order one “Issued to cutting” record is made for the net fabric received per colour and width in the Excel. Receipts entered manually on the site are not included and stay in stock. Orders not in the database, or opened only for fabric, also stay in stock."], "Ombordagini bir bosishda olish:": ["Взять со склада одним нажатием:", "Take from stock in one click:"], "Hammasini olish": ["Взять всё", "Take all"], "Partiyasiz": ["Без партии", "No batch"], "Tanlangan partiya: ": ["Выбранная партия: ", "Selected batch: "], "Excel'dagi kelgan matoning hammasini bichuvga berilgan deb belgilash": ["Отметить всю пришедшую ткань из Excel как выданную в раскрой", "Mark all fabric received in the Excel as issued to cutting"], "Omborda faqat saytda qo'lda kiritilgan kirim qoladi. Excel'dagi kirimlar \"Kelgan matolar\" va \"Kamomad\"da ko'rinadi.": ["На складе остаётся только приход, введённый на сайте вручную. Приходы из Excel видны в «Пришедшая ткань» и «Недостача».", "Only receipts entered manually on the site stay in stock. Excel receipts appear under “Received fabric” and “Shortage”."], "U bichuvga berilgan deb belgilanmagan, shuning uchun ombor to'la ko'rinyapti.": ["Она не отмечена как выданная в раскрой, поэтому склад выглядит полным.", "It is not marked as issued to cutting, so the stock looks full."], "Excel'dan kelganlarni bichuvga berilgan deb belgilash": ["Отметить приход из Excel как выданный в раскрой", "Mark Excel receipts as issued to cutting"], "Belgilanmoqda…": ["Отмечаем…", "Marking…"], "Excel importini bekor qilish": ["Отменить импорт Excel", "Undo the Excel import"], "Excel'dan ko'chirilgan hamma kirim va avtomatik \"bichuvga berildi\" yozuvlari, hamda faqat mato uchun ochilgan bo'sh zakazlar o'chiriladi. Saytda qo'lda kiritilgan kirim, chiqim va brak qoladi. Zakazlarning mato ehtiyoji o'zgarmaydi.": ["Удаляются все приходы из Excel, автоматические записи «выдано в раскрой» и пустые заказы, открытые только для ткани. Приход, выдача и брак, введённые на сайте вручную, остаются. Потребность заказов в ткани не меняется.", "All Excel receipts, automatic “issued to cutting” records and empty fabric-only orders are deleted. Receipts, issues and defects entered manually on the site stay. Orders' fabric requirements do not change."], "Importni bekor qilish": ["Отменить импорт", "Undo import"], "Ha, Excel importini o'chirish": ["Да, удалить импорт Excel", "Yes, delete the Excel import"], "O'chirilmoqda…": ["Удаление…", "Deleting…"], "Harakatlar o'qilmoqda…": ["Читаются движения…", "Reading movements…"], "Excel'dan ochilgan zakazlarni ham ko'rsatish": ["Показать и заказы, открытые из Excel", "Also show orders opened from Excel"], "Tasnifdan chiqqan pachkaning sonini (braklar olib tashlangandan keyin) razmerga yozing va Enter bosing: shu son bitta pachka bo'ladi va faqat uning stikerlari chiqadi. Keyingi pachkani tayyor bo'lganda alohida chiqarasiz.": ["Впишите в размер количество пачки после сортировки (без брака) и нажмите Enter: это будет одна пачка, печатаются только её стикеры. Следующую пачку печатаете отдельно, когда она готова.", "Enter the bundle's count after sorting (defects removed) under its size and press Enter: that becomes one bundle and only its labels print. Print the next bundle separately when it is ready."], "Bitta pachka 1000 donadan ko'p bo'lmaydi.": ["В одной пачке не может быть больше 1000 штук.", "A bundle cannot hold more than 1000 pieces."], "Fayl bo'lmasa:": ["Если файла нет:", "No file?"], "Zakazni qo'lda kiritish": ["Ввести заказ вручную", "Enter order manually"], "masalan AFMW031126": ["например AFMW031126", "e.g. AFMW031126"], "Rang nomini va har bir razmer sonini yozing. Kerakli razmer bo'lmasa, pastdan qo'shing.": ["Впишите цвет и количество по каждому размеру. Если нужного размера нет, добавьте его ниже.", "Enter the colour and the quantity for each size. If a size is missing, add it below."]}; const R=[["^Korobka № ((?:[-+]?\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+(?:[.,]\\d+)?)|[^ ]+) skladga yozildi: (.*) · ((?:[-+]?\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+(?:[.,]\\d+)?)|[^ ]+) dona$", "Коробка № $1 записана на склад: $2 · $3 шт", "Box № $1 saved to warehouse: $2 · $3 pcs"], ["^Korobka № ((?:[-+]?\\d{1,3}(?:[ \\u00a0\\u202f]\\d{3})+(?:[.,]\\d+)?)|[^ ]+) o\\'chirild const STAGES = [
  {k:"kroy",  t:"Kroy",   long:"Kroy (kesildi)"},
  {k:"patok", t:"Patok",  long:"Patokga berildi"},
  {k:"tikuv", t:"Tikuv",  long:"Tikuvdan chiqdi (1-sort)"},
  {k:"brak",  t:"Brak",   long:"Brak"},
  {k:"sklad", t:"Sklad",  long:"Skladga topshirildi"},
  {k:"otgr",  t:"Jo'natildi", long:"Furaga yuklandi (jo'natildi)"},

const STAGE_KEYS = new Set(STAGES.map(s=>s.k));
const stageT = k => (STAGES.find(s=>s.k===k)||{t:k}).t;
function idOf(code){
  let out=""; for (const ch of String(code).trim()){ if (/[A-Za-z0-9_.@+:-]/.test(ch)) out+=ch; else out+="~"+Array.from(enc.encode(ch)).map(b=>b.toString(16).padStart(2,"0")).join("") }
  return ("o-"+out).slice(0,190);
}
const MODEL_FIX = {"polo":"Polo","поло":"Polo","tolstovka":"Tolstovka","толстовка":"Tolstovka","longsleewe":"Longsleeve","longsleeve":"Longsleeve","kepka":"Kepka","кепка":"Kepka","body size":"Body size"};
const normModel = m => { let s=String(m??"").trim().replace(/\s+/g," "); if (MODEL_FIX[s.toLowerCase()]) return MODEL_FIX[s.toLowerCase()];
  if (s && (s===s.toUpperCase() || s===s.toLowerCase())) s=s[0].toUpperCase()+s.slice(1).toLowerCase(); return s };
function codeDate(code){ const m=/(\d{2})(\d{2})(\d{2})(?!\d)/.exec(code||""); if(!m) return ""; const d=+m[1], mo=+m[2], y=+m[3]; if(d<1||d>31||mo<1||mo>12||y<20||y>40) return ""; return `20${m[3]}-${m[2]}-${m[1]}` }
const sortKey = o => { const a=o.upd||"", b=codeDate(o.code); return a>b?a:b };
const normColour = c => { const s=String(c??"").trim().replace(/\s+/g," "); return s ? s[0].toUpperCase()+s.slice(1) : s };
const normRost = r => { const s=String(r??"").trim(); return /^(стандарт|standart|standard|-)?$/i.test(s) ? "" : s };
const normSizeAny = s => { if (s==null) return ""; const n=normSize(String(s)); return n || String(s).trim() };
const SZ_ORDER = ["5XS","4XS","3XS","2XS","XS","S","M","L","XL","2XL","3XL","4XL","5XL","6XL","7XL","8XL","9XL","10XL","11XL"];
function sizeRank(s){ const i=SZ_ORDER.indexOf(s); if (i>=0) return i; const m=/^(\d+)/.exec(s); if (m) return 100+Number(m[1]); return 1000 }
const cmpSize = (a,b) => sizeRank(a)-sizeRank(b) || String(a).localeCompare(String(b));
const lkey = (m,c,r,s) => [m,c,r,s].join("|");
const N = v => (typeof v==="number" && isFinite(v)) ? v : 0;

function compute(order, moves){
  const rows = new Map();
  const get = (m,c,r,s) => { const k=lkey(m,c,r,s); let x=rows.get(k); if(!x){ x={m,c,r,s,zakaz:0,kroy:0,patok:0,tikuv:0,brak:0,sklad:0,otgr:0}; rows.set(k,x) } return x };
  for (const l of order.lines||[]) get(l.m||"",l.c||"",l.r||"",l.s||"").zakaz += N(l.q);
  let last = order.upd || "";
  for (const mv of moves){
    if (!STAGE_KEYS.has(mv.stage)) continue;
    if (mv.date && mv.date>last) last=mv.date;
    for (const it of mv.items||[]){ const x=get(it.m||"",it.c||"",it.r||"",it.s||""); if (x[mv.stage]!==undefined) x[mv.stage]+=N(it.q); if (it.d && it.d>last) last=it.d }
  }
  const list = Array.from(rows.values()).sort((a,b)=>a.m.localeCompare(b.m)||a.c.localeCompare(b.c)||a.r.localeCompare(b.r)||cmpSize(a.s,b.s));
  const tot={zakaz:0,kroy:0,patok:0,tikuv:0,brak:0,sklad:0,otgr:0,ombor:0,kam:0,ortiq:0,kroyKam:0};
  for (const x of list){ x.ombor=x.sklad-x.otgr; for (const k of ["zakaz","kroy","patok","tikuv","brak","sklad","otgr","ombor"]) tot[k]+=x[k];
    tot.kam += Math.max(0,x.zakaz-x.sklad); tot.ortiq += Math.max(0,x.sklad-x.zakaz); tot.kroyKam += Math.max(0,x.zakaz-x.kroy) }
  return {list, tot, last};
}
function status(o){
  const t=o.tot||{};
  if (o.archived) return {t:"Arxiv",c:"n"};
  if (!N(t.zakaz)) return N(t.kroy)||N(t.sklad) ? {t:"Zakazsiz",c:"warn"} : {t:"Bo'sh",c:"n"};
  if (N(t.otgr)>0 && N(t.otgr)>=N(t.zakaz)) return {t:"Jo'natildi",c:"ok"};
  if (N(t.sklad)>0 && !N(t.kam)) return {t:"Bajarildi",c:"ok"};
  if (N(t.sklad)>0) return {t:"Skladda qisman",c:"warn"};
  if (N(t.kroy)>0) return {t:"Ishlab chiqarishda",c:"warn"};
  return {t:"Yangi",c:"n"};
}

async function saveEdit(o){
  const E=S.edit;
  for (const r of E.rows){ r.c=normColour(r.c); r.r=normRost(r.r); r.m=normModel(r.m) }
  if (E.rows.some(r=>!r.c)){ toast("Har bir qatorga rang nomini yozing.",true); return }
  const map=new Map();
  for (const r of E.rows) for (const z of E.sizes){ const q=Math.round(Number(r.q[z])||0); if (q<=0) continue; const k=lkey(r.m,r.c,r.r,z); const x=map.get(k); if (x) x.q+=q; else map.set(k,{m:r.m,c:r.c,r:r.r,s:z,q}) }
  const lines=Array.from(map.values());
  const renames=E.rows.filter(r=>r.oc!=null && (r.oc!==r.c || r.or!==r.r || r.om!==r.m));
  S.healBlock=Date.now()+5000;
  try{
    let moves=S.curMoves;
    if (renames.length){
      const out=[];
      for (const mv of moves){
        let changed=false;
        const fix=it=>{ const rn=renames.find(r=>(it.m||"")===r.om && (it.c||"")===r.oc && (it.r||"")===r.or); if (!rn) return it; changed=true; return {...it, m:rn.m, c:rn.c, r:rn.r} };
        const items=(mv.items||[]).map(fix); const rows=mv.rows ? mv.rows.map(fix) : undefined;
        if (changed){ const upd={items}; if (rows) upd.rows=rows; await S.db.doc(`orders/${o.id}/moves/${mv.id}`).update(upd); out.push({...mv,...upd}) } else out.push(mv);
      }
      moves=out; S.curMoves=out;
    }
    const models=[...new Set([...lines.map(l=>l.m), ...moves.flatMap(m=>(m.items||[]).map(i=>i.m))].filter(Boolean))];
    const {tot,last}=compute({...o,lines},moves);
    await S.db.doc(`orders/${o.id}`).update({lines, models, brand:E.brand||"", customer:(E.customer||"").trim(), product:(E.product||"").trim(), boxGroup:(E.boxGroup||"").trim(), tot, upd:last||""});
    S.edit=null; toast(`Zakaz saqlandi: ${fmt(tot.zakaz)} dona`); render();
  }catch(e){ toast(dbErr(e),true) }
}

function groupSizes(items){ const byC=new Map(); for(const i of items){ const k=[i.c,i.r].filter(Boolean).join(" "); if(!byC.has(k)) byC.set(k,[]); byC.get(k).push(i) }
  return Array.from(byC).map(([k,xs])=>k+": "+xs.sort((a,b)=>cmpSize(a.s,b.s)).map(i=>`${i.s} ${fmt(N(i.q))}`).join(", ")).join(" | ") }

async function saveEntry(o, combo){
  const E=S.entry;
  const c = E.combo==="__new" ? normColour(E.nc.c) : combo.c;
  if (!c){ toast("Rang nomini yozing.",true); return }
  const m = E.combo==="__new" ? (E.nc.m||"") : combo.m, r = E.combo==="__new" ? normRost(E.nc.r) : combo.r;
  const items = Object.entries(E.qty).map(([s,v])=>({m,c,r,s,q:Math.round(Number(v)||0)})).filter(i=>i.q);
  if (!items.length) return;
  if (E.stage==="otgr"){ const {list}=compute(o,S.curMoves); const bad=items.filter(i=>{ const x=list.find(l=>l.m===i.m&&l.c===i.c&&l.r===i.r&&l.s===i.s); return i.q>0 && i.q>(x?x.sklad-x.otgr:0) });
    if (bad.length){ toast("Omborda buncha yo'q: "+bad.map(i=>i.s).join(", ")+". Jo'natilgan soni ombordagidan oshmasin.",true); return } }
  const doc = { stage:E.stage, date:E.date||todayISO(), items, note:(E.note||"").trim(), by:S.me||null, at:new Date().toISOString(), label:[c,r].filter(Boolean).join(" · ") };
  if (E.stage==="kroy"){ if (E.nastil) doc.nastil=E.nastil.trim(); if (E.partiya) doc.partiya=E.partiya.trim(); if (Number(E.kg)) doc.kg=Number(E.kg) }
  try{
    const ref = S.db.collection(`orders/${o.id}/moves`).doc();
    await ref.set(doc);
    if (!S.curMoves.some(x=>x.id===ref.id)) S.curMoves=[...S.curMoves,{id:ref.id,...doc}];
    await saveTot(o.id);
    const t=items.reduce((s,i)=>s+i.q,0);
    toast(`Saqlandi: ${stageT(E.stage)} · ${o.code} · ${c} · ${fmt(t)} dona`);
    E.qty={}; E.extra=[]; E.note=""; if (E.stage==="kroy"){ E.nastil=""; E.kg="" }
    render();
  }catch(e){ toast(dbErr(e),true) }
}

/* ---------- order-file reader (any letter sizes, two-row headers, code from file name) ---------- */
function anySize(v){
  if (typeof v!=="string") return null; let s=v.trim().toUpperCase().replace(/\s+/g,"");
  const X={XXS:"2XS",XXXS:"3XS",XXXXS:"4XS",XXXXXS:"5XS",XXL:"2XL",XXXL:"3XL",XXXXL:"4XL",XXXXXL:"5XL",XXXXXXL:"6XL"}; if (X[s]) s=X[s];
  if (SZ_ORDER.includes(s)) return s;
  if (/^\d{2,3}-\d{2,3}$/.test(s)) return s;
  if (/^ONE ?SIZE$/.test(s)) return "Onesize";

const PXMM = 8; // 203 dpi, XP-470B native resolution
function drawSticker(d, st){
  st = st || SET(); const W=st.label.w, H=st.label.h, k=PXMM;
  const cv=document.createElement("canvas"); cv.width=Math.round(W*k); cv.height=Math.round(H*k);

  const F="Arial, 'Helvetica Neue', Helvetica, 'Liberation Sans', sans-serif";
  const text=(t,x,y,size,{bold=false,italic=false,align="left",max=W-6}={})=>{ t=String(t??""); let s=size*Math.min(sx,sy*1.1);
    do { g.font=`${italic?"italic ":""}${bold?"bold ":""}${mm(s)}px ${F}`; if (g.measureText(t).width<=mm(max)) break; s-=0.1 } while (s>1.2);
    g.textAlign=align; g.fillText(t,mm(x),mm(y)) };
  const b=d.brand||{};

    // Е
    R(x0,y0,t,hh); R(x0,y0,w,t); R(x0,y0+hh/2-t/2,w,t); R(x0,y0+hh-t,w,t);
    // А
    const xa=x0+w+gap; R(xa,y0,t,hh); R(xa+w-t,y0,t,hh); R(xa,y0,w,t); R(xa,y0+hh/2-t/2,w,t);
    // С
    const xc=xa+w+gap; R(xc,y0,t,hh); R(xc,y0,w,t); R(xc,y0+hh-t,w,t);

  text("Импортер:", W/2, 67.5*sy, 3.2, {bold:true,align:"center"}); text(b.importer, W/2, 71.5*sy, 3.1, {bold:true,align:"center"});

  text(b.country, W/2, 98*sy, 3.6, {bold:true,italic:true,align:"center"});
  // crisp black/white for the thermal head
  const im=g.getImageData(0,0,cv.width,cv.height), p=im.data; for (let i=0;i<p.length;i+=4){ const v=(p[i]+p[i+1]+p[i+2])/3 < 150 ? 0 : 255; p[i]=p[i+1]=p[i+2]=v; p[i+3]=255 } g.putImageData(im,0,0);

}
function stickerPreview(d, st){ const cv=drawSticker(d, st); cv.style.cssText="width:"+Math.min(260, (st||SET()).label.w*4.4)+"px;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;image-rendering:auto"; cv.setAttribute("role","img"); cv.setAttribute("aria-label","Stiker namunasi"); return cv }
async function deflateZ(u8){ const cs=new CompressionStream("deflate"); return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(cs)).arrayBuffer()) }
async function stickersPdf(list){
  const st=SET(); const Wpt=st.label.w*72/25.4, Hpt=st.label.h*72/25.4;
  const parts=[]; const offs=[]; let len=0; const push=x=>{ const b=typeof x==="string"?enc.encode(x):x; parts.push(b); len+=b.length };
  const obj=(n,body)=>{ offs[n]=len; push(`${n} 0 obj\n`); for (const b of [].concat(body)) push(b); push("\nendobj\n") };
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const n=list.length, kids=[]; let id=3;

  for (const d of list){ const cv=drawSticker(d); const g=cv.getContext("2d").getImageData(0,0,cv.width,cv.height).data;
    const gray=new Uint8Array(cv.width*cv.height); for (let i=0,j=0;i<g.length;i+=4,j++) gray[j]=g[i];
    pages.push({w:cv.width,h:cv.height,data:await deflateZ(gray)}) }
  const objs=[];
  for (const pg of pages){ const p=id++, c=id++, im=id++; kids.push(p); objs.push({p,c,im,pg}) }
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  obj(2,`<< /Type /Pages /Count ${n} /Kids [${kids.map(k=>k+" 0 R").join(" ")}] >>`);
  for (const {p,c,im,pg} of objs){
    obj(p,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wpt.toFixed(2)} ${Hpt.toFixed(2)}] /Resources << /XObject << /I0 ${im} 0 R >> >> /Contents ${c} 0 R >>`);
    const cs=`q ${Wpt.toFixed(2)} 0 0 ${Hpt.toFixed(2)} 0 0 cm /I0 Do Q`;
    obj(c,[`<< /Length ${cs.length} >>\nstream\n`, cs, "\nendstream"]);
    obj(im,[`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceGray /BitsPerComponent 8 /Filter /FlateDecode /Length ${pg.data.length} >>\nstream\n`, pg.data, "\nendstream"]);
  }
  const xref=len; const total=id;
  let x=`xref\n0 ${total}\n0000000000 65535 f \n`; for (let i=1;i<total;i++) x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
  push(x); push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  return new Blob(parts,{type:"application/pdf"});
}

async function deleteFura(file){
  let n=0, dona=0;

    for (const o of Array.from(S.orders.values()).filter(o=>(o.furas||[]).includes(file))){
      const snap=await S.db.collection(`orders/${o.id}/moves`).get();
      let moves=snap.docs.map(d=>({id:d.id,...d.data()}));
      for (const mv of moves.filter(m=>m.stage==="sklad" && m.src===file)){
        if (!S.isOwner && mv.by!==S.me) continue;
        await S.db.doc(`orders/${o.id}/moves/${mv.id}`).delete(); dona+=(mv.items||[]).reduce((s,i)=>s+N(i.q),0); n++ }

  }catch(e){ toast(dbErr(e),true) }
}

async function handleScan(raw){
  const K=T.K; const v=String(raw||"").trim(); if (!v) return;
  if (/^I/i.test(v)){ const id=v.slice(1).trim(); const f=(T.workers||[]).find(x=>x.id===id); if (f){ setWorker(f.id); beep(true); K.res={ok:true,title:`Ishchi: ${f.name}`,sub:"Endi uning stikerlarini skanerlang"}; render() } else { beep(false); K.res={ok:false,title:"Bunday tabel raqamli ishchi yo'q: "+id}; render() } return }

  if (!K.worker){ beep(false); K.res={ok:false,title:"Avval ishchini tanlang"}; render(); return }
  try{
    const p=await getPack(pc.pack);
    if (!p){ beep(false); K.res={ok:false,title:"Bunday pachka topilmadi",sub:"Kod: "+pc.code}; render(); return }
    const op=(p.ops||[]).find(x=>Number(x.k)===pc.k);

    const row={code:packCode(p.id,op.k), pack_id:p.id, op_k:op.k, op_name:op.name, price:Number(op.price)||0, qty:p.qty, worker:K.worker, day:K.day, order_id:p.order_id, order_code:p.order_code, m:p.m, c:p.c, r:p.r, s:p.s};
    const {error}=await sb().from("scans").insert(row);

      if (error.code==="23505" || /duplicate/i.test(error.message||"")){ let who=""; try{ const i=(await Q(sb().rpc("scan_info",{p_code:row.code})))?.[0]; if (i) who=`${i.name||i.worker} · ${i.day}` }catch(e){}
        beep(false); K.res={ok:false,title:"Bu stiker allaqachon skanerlangan",sub:[op.name, who].filter(Boolean).join(" · ")}; render(); return }
      throw error;

    beep(true); (K.day_rows ||= []).push({...row, at:new Date().toISOString()});

}

async function saveModel(ME){
  const name=ME.name.trim(); if (!name){ toast("Model nomini yozing",true); return }
  const ops=ME.ops.filter(o=>String(o.name).trim()); if (ops.length>99){ toast("Bitta modelda ko'pi bilan 99 ta operatsiya",true); return }
  let nextk=Number(ME.nextk)||1; for (const o of ops){ if (o.k==null){ o.k=nextk++ } else nextk=Math.max(nextk,Number(o.k)+1) }
  if (nextk>100){ // reuse free numbers when the counter overflows two digits
    const used=new Set(ops.filter(o=>o.k<100).map(o=>o.k)); let f=1; for (const o of ops) if (o.k>=100){ while (used.has(f)) f++; o.k=f; used.add(f) } nextk=100 }
  const row={id:ME.id || ("tm-"+Date.now().toString(36)), name, aliases:ME.aliases||[], ops:ops.map(o=>({k:o.k,name:String(o.name).trim(),price:Number(o.price)||0})), nextk, updated_at:new Date().toISOString()};
  try{ await Q(sb().from("tmodels").upsert(row)); await loadModels(true); T.ME=null; toast("Model saqlandi: "+name); render() }catch(e){ toast(err(e),true) }
}

  try{ await Q(sb().from("tmodels").delete().eq("id",ME.id)); await loadModels(true); T.ME=null; toast("O'chirildi"); render() }catch(e){ toast(err(e),true) }
}

<script>/* ================= MATO OMBORI: ehtiyoj, kirim, bichuvga chiqim, brak (ta'mir / 4-sort) ================= */
(function(){
const SITE = window.SITE;
const MS = SITE.mt = { sub: pref.get("mt_sub","kirim"), order:"", line:"", f:{}, subs:{}, moves:{}, all:null, ed:null, q:"" };
const SUBS = [["kirim","Mato kirimi"],["keldi","Kelgan matolar"],["chiqim","Bichuvga berish"],["brak","Brak mato"],["ombor","Ombordagi mato"],["sort4","4-sort mato"],["tamir","Ta'mirdagi mato"],["ehtiyoj","Zakaz ehtiyoji"],["kam","Kamomad"]];
const MST = new Set(["mato_in","mato_out","mato_brak"]);
SITE.matoOk = () => SITE.can("mato");
const kg = v => { const n=Math.round((Number(v)||0)*10)/10; return n.toLocaleString("ru-RU",{maximumFractionDigits:1}).replace(/ /g," ") };
// fabric type and width are compared loosely: "30/1 KARDE SUPREM" = "Supreme", 0.46 = 46
const tN = t => { const s=String(t||"").toLowerCase().trim(); if (!s) return ""; for (const k of ["ribana","yoqa","manjet","pike","futer","kapyushon"]) if (s.includes(k)) return k+(s.includes("penye")?"-p":""); if (/suprem/.test(s)) return "suprem"+(s.includes("penye")?"-p":"")+(s.includes("lyc")?"-l":""); return s };
const enN = e => { const s=String(e??"").trim().replace(",","."); if (!s) return ""; const n=Number(s); if (isFinite(n)) return String(n<3 ? Math.round(n*100) : Math.round(n*100)/100); return s.toUpperCase().replace(/\s+/g," ") };
const lk = (c,t,en) => [normColour(c||"").toLowerCase(),tN(t),enN(en)].join("|");
const lineName = l => [l.c||"(rangsiz)", l.t, l.en ? "eni "+enN(l.en) : ""].filter(Boolean).join(" · ");
const sofOf = F => { const fn = String(F.fnet??"").trim()!=="" ? numIn(F.fnet) : numIn(F.net); const sal = String(F.sal??"").trim()!=="" ? numIn(F.sal) : numIn(F.rul)*0.1; return Math.round((fn - sal - numIn(F.vz))*100)/100 };
const isoSerial = n => new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5).toISOString().slice(0,10);
const trT = s => (window.__T ? window.__T(s) : s);
const numIn = v => { const n=Number(String(v??"").replace(",",".").replace(/\s/g,"")); return isFinite(n)?n:0 };

/* ---------- live moves of one order ---------- */
function watch(oid){
  if (!oid || MS.subs[oid]) return;
  MS.subs[oid]=S.db.collection(`orders/${oid}/moves`).onSnapshot(snap=>{ MS.moves[oid]=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>MST.has(m.stage)); if (S.view==="mato") render() }, ()=>{});
}
// balance per line of an order: need, arrived, issued to cutting, defects (repair / 4th grade), stock
function balance(o, moves){
  const L=new Map();
  const get=(c,t,en)=>{ const k=lk(c,t,en); let x=L.get(k); if (!x){ x={c:c||"",t:t||"",en:en||"",kerak:0,keldi:0,keldiR:0,berildi:0,berildiR:0,brakB:0,brakO:0,brakR:0,tamir:0,sort4:0}; L.set(k,x) } return x };
  for (const l of (o.mato||[])) get(l.c,l.t,l.en).kerak += numIn(l.kg);
  for (const mv of moves||[]) for (const it of (mv.items||[])){ const x=get(it.c,it.t,it.en); const q=numIn(it.kg), r=numIn(it.rul);

function partStock(moves, key){

  const ms=[...(moves||[])].sort((a,b)=>(a.date||"").localeCompare(b.date||"")||(a.at||"").localeCompare(b.at||""));
  for (const m of ms) for (const it of (m.items||[])){ if (lk(it.c,it.t,it.en)!==key) continue; const q=numIn(it.kg), r=numIn(it.rul);
    if (m.stage==="mato_in"){ const p=String(m.part??"").trim(); let x=P.get(p); if (!x){ x={part:p,kg:0,rul:0,date:m.date||"",src:m.src||""}; P.set(p,x) } x.kg+=q; x.rul+=r }
    else if (m.stage==="mato_out"){ const p=String(m.part??"").trim(); if (p && P.has(p)){ P.get(p).kg-=q; P.get(p).rul-=r } else { un.kg+=q; un.rul+=r } }

  const list=[...P.values()];
  for (const x of list){ const t=Math.min(Math.max(x.kg,0),un.kg); x.kg-=t; un.kg-=t; const tr=Math.min(Math.max(x.rul,0),un.rul); x.rul-=tr; un.rul-=tr }

    else if ((m.date||"")>last) continue;
    else if (m.stage==="mato_out"){ x.ber+=q; x.berR+=r } else if (m.stage==="mato_brak" && m.from==="ombor") x.brakO+=q } }
  const items=[]; for (const x of L.values()){ const q=Math.round((x.keldi-x.ber-x.brakO)*100)/100; if (q<=0.004) continue; const it={c:x.c,t:x.t,en:x.en,kg:q}; const r=Math.round(x.rul-x.berR); if (r>0) it.rul=r; items.push(it) }

function parseMato(sheets){
  const out=[];
  for (const sh of sheets){ const g=sh.grid;
    // A) "Крашенный полотно" matrix: colour rows × width columns (+ Рибана column)
    for (let r=0;r<g.length;r++){ const row=g[r]||[]; const c0=row.findIndex(v=>typeof v==="string" && /^\s*крашен\S*\s+полотн\S*\s*$/i.test(v)); if (c0<0) continue;
      const cols=[]; for (let c=c0+1;c<row.length;c++){ const v=row[c]; if (v==null || v==="") continue; const s=String(v).trim(); if (/итого|jami|всего/i.test(s)) continue; cols.push({c, en: /рибан|ribana/i.test(s) ? "" : s, t: /рибан|ribana/i.test(s) ? "Ribana" : ""}) }
      for (let rr=r+1; rr<g.length; rr++){ const lab=str(g[rr]?.[c0]); if (!lab || /итого|jami|всего/i.test(lab) || /^[A-Z]{2,}\d{4,}/.test(lab)) break;
        for (const col of cols){ const v=g[rr][col.c]; if (typeof v==="number" && v>0) out.push({c:normColour(lab), t:col.t, en:String(col.en).replace(/^0\./,"0."), kg:Math.round(v*100)/100}) } }
    }
    // B) row list: "Mato nomi" · "Finish Eni" · "Rangi" · "Tayyor KG"
    for (let r=0;r<Math.min(g.length,60);r++){ const row=g[r]||[]; const f=re=>row.findIndex(v=>typeof v==="string" && re.test(v.trim()));
      const ci=f(/^rangi?$|^цвет$/i), ki=f(/tayyor\s*kg|готов.*кг|крашен.*кг/i); if (ci<0 || ki<0) continue;
      const ti=f(/mato\s*nomi|полотно|наименование/i), ei=f(/eni|ширин|диамет/i);
      for (let rr=r+1; rr<g.length; rr++){ const x=g[rr]||[]; const c=str(x[ci]); if (!c) continue; const v=x[ki]; if (!(typeof v==="number" && v>0)) continue;
        let t=ti>=0?str(x[ti]):""; if (/рибан|ribana/i.test(t)) t="Ribana"; else if (/супрем|supreme|suprem/i.test(t)) t="Supreme";
        out.push({c:normColour(c), t, en: ei>=0 && x[ei]!=null ? String(x[ei]) : "", kg:Math.round(v*100)/100}) }
      break;
    }
  }
  // merge same line
  const m=new Map(); for (const l of out){ const k=lk(l.c,l.t,l.en); const y=m.get(k); if (y) y.kg=Math.round((y.kg+l.kg)*100)/100; else m.set(k,{...l}) }
  return [...m.values()];
}

        h("button",{class:"btn quiet small",type:"button",onclick:()=>{ ED.rows.push({c:"",t:"",en:"",kg:""}); render(); setTimeout(()=>{ const el=$("me_c"+(ED.rows.length-1)); el&&el.focus() },0) }},"+ Qator qo'shish"),
        h("button",{class:"btn quiet small",type:"button",onclick:()=>{ const cs=[...new Set((o.lines||[]).map(l=>l.c))]; for (const c of cs) if (!ED.rows.some(r=>r.c===c)) ED.rows.push({c,t:"",en:"",kg:""}); render() }},"Zakazdagi ranglarni qo'shish"),
        h("span",{class:"spacer"}),

        h("button",{class:"btn primary",type:"button",onclick:async()=>{
          const mato=[]; const seen=new Map();
          for (const r of ED.rows){ const c=normColour(r.c), q=numIn(r.kg); if (!c && !q) continue; if (!c){ toast("Har bir qatorga rang yozing.",true); return }
            const l={c, t:(r.t||"").trim(), en:String(r.en||"").trim().replace(",","."), kg:Math.round(q*100)/100}; const k=lk(l.c,l.t,l.en); if (seen.has(k)) seen.get(k).kg+=l.kg; else { seen.set(k,l); mato.push(l) } }
          try{ await S.db.doc(`orders/${o.id}`).update({mato}); o.mato=mato; MS.ed=null; toast(`Mato ehtiyoji saqlandi: ${kg(mato.reduce((s,l)=>s+l.kg,0))} kg`); render() }catch(e){ toast(dbErr(e),true) } }},"Saqlash")))));
}

/* ---------- nav ---------- */
SITE.addMatoNav = () => {
  const nav=document.querySelector("nav"); if (nav.querySelector('[data-view="mato"]')) return;
  const b=document.createElement("button"); b.type="button"; b.dataset.view="mato"; b.textContent="Mato"; b.addEventListener("click",()=>setView("mato"));

<script>/* ================= PDF ZAKAZ: "Ishlab chiqarish zakazi" PDF'idan zakaz soni va mato ehtiyojini o'qish ================= */
(function(){
const G = typeof window!=="undefined" ? window : globalThis;
const SITE = G.SITE || (G.SITE = {});
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
const PDFW  = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
const TESS  = "https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";

/* ---------- helpers ---------- */
const SIZE_RE = /^(XXS|XS|S|M|L|XL|XXL|XXXL|[2-9]XL)$/;
const fixSize = t => { let s=String(t).toUpperCase().replace(/[^A-Z0-9]/g,""); s=s.replace(/^([2-9])X1$/,"$1XL").replace(/^X1$/,"XL"); return s };
const isNum = t => /^-?\d+(?:[.,]\d+)?$/.test(t);
const num = t => Number(String(t).replace(/\s/g,"").replace(",","."));
const hasLetter = t => /[A-Za-zА-Яа-яЁёЎўҚқҒғҲҳ]/.test(t);
const WID_RE = /^\d{1,3}(?:[.,]\d{1,2})?(?:\/\d{1,3}(?:[.,]\d{1,2})?)?$/;

function toLines(words){
  const ws = words.filter(w=>w.t && w.t.trim()).map(w=>({...w, t:w.t.trim(), yc:(w.y0+w.y1)/2, hh:w.y1-w.y0}));
  if (!ws.length) return [];
  const hs = ws.map(w=>w.hh).sort((a,b)=>a-b); const mh = hs[Math.floor(hs.length/2)] || 20;
  ws.sort((a,b)=>a.yc-b.yc);
  const lines=[];
  for (const w of ws){ const L=lines[lines.length-1]; if (L && Math.abs(w.yc-L.yc) < mh*0.55){ L.w.push(w); L.yc=(L.yc*(L.w.length-1)+w.yc)/L.w.length } else lines.push({yc:w.yc, w:[w]}) }
  for (const L of lines){ L.w.sort((a,b)=>a.x0-b.x0);
    // join thousands: "1" "250" -> "1250", "1" "909,5" -> "1909,5"
    const out=[];
    for (const w of L.w){ const p=out[out.length-1];
      if (p && /^\d{1,3}$/.test(p.t) && /^\d{3}(?:[.,]\d+)?$/.test(w.t) && (w.x0-p.x1) < mh*0.75){ p.t+=w.t; p.x1=w.x1; p.c=Math.min(p.c,w.c) }
      else out.push({...w}) }
    L.w=out; L.text=out.map(w=>w.t).join(" ") }
  return lines;
}
// nearest column by right edge (numbers are right aligned)
function colOf(cols, w){ let best=null, bd=1e9; for (const c of cols){ const d=Math.abs(w.x1-c.x1); if (d<bd){ bd=d; best=c } } return best && bd < best.tol ? best : null }
function withTol(cols){ const xs=cols.map(c=>c.x1).sort((a,b)=>a-b); let sp=1e9; for (let i=1;i<xs.length;i++) sp=Math.min(sp, xs[i]-xs[i-1]); if (!isFinite(sp)||sp>=1e9) sp=200; for (const c of cols) c.tol=Math.max(sp*0.45, 12); return cols }
const cleanName = ws => ws.filter(w=>hasLetter(w.t) && !(w.t.length<=2 && !/^[A-Za-zА-Яа-я]{2}$/.test(w.t))).map(w=>w.t).join(" ").replace(/^[^A-Za-zА-Яа-яЁё]+/,"").trim();

/* ---------- colour matching ---------- */
const ckey = s => String(s||"").toLowerCase().replace(/ё/g,"е").replace(/[^a-zа-я0-9]/g,"");
function lev(a,b){ const m=a.length,n=b.length; if (!m) return n; if (!n) return m; let p=Array.from({length:n+1},(_,i)=>i);
  for (let i=1;i<=m;i++){ const q=[i]; for (let j=1;j<=n;j++) q[j]=Math.min(p[j]+1,q[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1)); p=q } return p[n] }
function matchColour(name, known){
  const k=ckey(name); if (!k || !known || !known.length) return name;
  let best=null, bd=1e9; for (const c of known){ const d=lev(k, ckey(c)); if (d<bd){ bd=d; best=c } }
  return best && bd <= Math.max(2, Math.round(ckey(best).length*0.3)) ? best : name;
}

/* ---------- page 1: tikuv uchun zakaz soni ---------- */
function parseOrderPage(words){
  const lines=toLines(words); const text=lines.map(l=>l.text).join("\n");
  const hi=lines.findIndex(L=>L.w.some(w=>/^rang$/i.test(w.t)) && L.w.filter(w=>SIZE_RE.test(fixSize(w.t))).length>=4);
  if (hi<0) return null;
  const H=lines[hi];
  let cols=H.w.filter(w=>SIZE_RE.test(fixSize(w.t))).map(w=>({k:fixSize(w.t), x0:w.x0, x1:w.x1}));
  // o'qilmay qolgan razmer sarlavhasini qo'shnilari orasidan tiklash (masalan XS · ? · M -> S)
  const ORD=["XXS","XS","S","M","L","XL","XXL","XXXL","4XL","5XL","6XL","7XL","8XL","9XL"];
  cols=cols.filter((c,i,a)=>a.findIndex(x=>x.k===c.k)===i).sort((a,b)=>a.x1-b.x1);
  for (let i=1;i<cols.length;i++){ const a=ORD.indexOf(cols[i-1].k), b=ORD.indexOf(cols[i].k); if (a<0||b<0||b-a<2||b-a>4) continue;
    const add=[]; for (let k=a+1;k<b;k++){ const f=(k-a)/(b-a); add.push({k:ORD[k], x0:cols[i-1].x0+(cols[i].x0-cols[i-1].x0)*f, x1:cols[i-1].x1+(cols[i].x1-cols[i-1].x1)*f, guess:true}) }
    cols.splice(i,0,...add); i+=add.length }
  withTol(cols);
  const ji=H.w.findIndex(w=>/^jami/i.test(w.t));
  const jamiCol = ji>=0 ? {k:"_jami", x1:Math.max(...H.w.slice(ji, ji+2).filter(w=>hasLetter(w.t)).map(w=>w.x1))} : null;
  const all = jamiCol ? withTol([...cols, jamiCol]) : cols;
  const left = Math.min(...cols.map(c=>c.x0)) - (cols[1] ? (cols[1].x1-cols[0].x1)*0.6 : 60);
  const rows=[], warn=[]; let jamiRow=null;
  for (let i=hi+1;i<lines.length;i++){ const L=lines[i];
    const first=L.w.find(w=>hasLetter(w.t)); if (first && /^jami$/i.test(first.t)){ jamiRow=L; break }
    const name=cleanName(L.w.filter(w=>w.x1<left)); if (!name) { if (rows.length) break; else continue }
    const qty={}, low=[]; let jami=null;
    for (const w of L.w.filter(w=>w.x1>=left && isNum(w.t))){ const c=colOf(all,w); if (!c){ warn.push(`${name}: ${w.t} soni qaysi razmerga tegishli ekani aniqlanmadi`); continue }
      if (c.k==="_jami") jami=num(w.t); else { qty[c.k]=Math.round(num(w.t)); if (w.c<80) low.push(c.k) } }
    const total=Object.values(qty).reduce((a,b)=>a+b,0);
    if (!total) continue;
    if (jami!=null && jami!==total) warn.push(`${name}: qatorlar yig'indisi ${total}, PDF'dagi jami ${jami}`);
    rows.push({name, qty, total, low});
  }
  if (jamiRow){ for (const w of jamiRow.w.filter(w=>isNum(w.t))){ const c=colOf(all,w); if (!c || c.k==="_jami") continue; const s=rows.reduce((a,r)=>a+(r.qty[c.k]||0),0); if (s!==Math.round(num(w.t))) warn.push(`${c.k} razmer: ranglar yig'indisi ${s}, PDF'dagi jami ${num(w.t)}`) } }
  const g=(re)=>{ const m=re.exec(text); return m ? m[1].trim() : "" };
  const code = g(/\b([A-Z]{4}\d{6}(?:[-_][A-Z0-9]+)?)\b/);
  return { code, model:g(/Model:\s*(.+?)\s+Mijoz:/), customer:g(/Mijoz:\s*(.+?)\s+Sana:/), date:g(/Sana:\s*([\d.]{8,10})/), due:g(/Muddat:\s*([\d.]{8,10})/),
    sizes: cols.map(c=>c.k).filter(k=>rows.some(r=>r.qty[k])), colours: rows, total: rows.reduce((a,r)=>a+r.total,0), warn };
}

/* ---------- page 2: bo'yalgan mato zakazi ---------- */
function parseMatoPage(words){
  const lines=toLines(words); const text=lines.map(l=>l.text).join("\n");
  const hi=lines.findIndex(L=>L.w.some(w=>/^rang$/i.test(w.t)) && L.w.filter(w=>WID_RE.test(w.t) && /[\/.,]/.test(w.t)).length>=2);
  if (hi<0) return null;
  const H=lines[hi];
  const rang=H.w.find(w=>/^rang$/i.test(w.t)); const gr=H.w.find(w=>/^gr$/i.test(w.t));
  const bi=H.w.findIndex(w=>/^bo.?yalgan/i.test(w.t.replace(/[‘’`ʻ']/g,"'")));
  const xi=H.w.findIndex(w=>/^xom/i.test(w.t));
  const widths=H.w.filter(w=>w.x0>rang.x1 && (bi<0 || w.x1<H.w[bi].x0) && WID_RE.test(w.t)).map(w=>({k:"w", en:w.t.replace(",","."), x0:w.x0, x1:w.x1}));
  const cols=[...widths];
  if (bi>=0) cols.push({k:"_boy", x1:Math.max(...H.w.slice(bi, xi>=0?xi:undefined).map(w=>w.x1))});
  if (xi>=0) cols.push({k:"_xom", x1:Math.max(...H.w.slice(xi).map(w=>w.x1))});
  if (gr) cols.push({k:"_gr", x1:gr.x1});
  withTol(cols);
  const firstW = widths.length ? Math.min(...widths.map(w=>w.x0)) : 1e9;
  const out=[], warn=[]; let last=null;
  for (let i=hi+1;i<lines.length;i++){ const L=lines[i];
    const first=L.w.find(w=>hasLetter(w.t)); if (first && /^jami$/i.test(first.t)) break;
    const nameW=L.w.filter(w=>w.x1 < (gr ? gr.x0-4 : rang.x0-4) && !isNum(w.t));
    const fab=nameW.map(w=>w.t).join(" ");
    const colour=cleanName(L.w.filter(w=>w.x0>=rang.x0-40 && w.x1<firstW && !isNum(w.t)));
    const vals={}; let boy=null;
    for (const w of L.w.filter(w=>isNum(w.t) && w.x0>rang.x0)){ const c=colOf(cols,w); if (!c) continue; if (c.k==="w") vals[c.en]=num(w.t); else if (c.k==="_boy") boy=num(w.t) }
    const rib = /рибан|рибон|ribana|ribona/i.test(L.text) || (!Object.keys(vals).length && /lik|лик/i.test(fab));
    if (!fab && !colour && boy==null) continue;
    if (rib){ const c = last ? last.c : colour; if (boy) out.push({c, cOcr:colour, t:"Ribana", en:"", kg:boy, name:fab}); continue }
    const t = /супрем|suprem|cynpem|cyпрем/i.test(fab) ? "Supreme" : fab;
    last={c:colour}; const sum=Object.values(vals).reduce((a,b)=>a+b,0);
    if (boy!=null && Math.abs(sum-boy)>0.15) warn.push(`${colour}: enlar yig'indisi ${Math.round(sum*10)/10} kg, PDF'dagi "Bo'yalgan" ${boy} kg`);
    for (const [en,kg] of Object.entries(vals)) if (kg>0) out.push({c:colour, t, en, kg:Math.round(kg*10)/10, name:fab});
  }
  const g=(re)=>{ const m=re.exec(text); return m ? m[1].trim() : "" };
  return { code:g(/\b([A-Z]{4}\d{6}(?:[-_][A-Z0-9]+)?)\b/), boyoqxona:g(/Bo.?yoqxona:\s*(.+?)\s+Model:/), lines:out, total:Math.round(out.reduce((a,l)=>a+l.kg,0)*10)/10, warn };
}

/* ---------- PDF -> rasm -> matn ---------- */
const loaded={};
function loadScript(src){ return loaded[src] ||= new Promise((ok,bad)=>{ const s=document.createElement("script"); s.src=src; s.onload=ok; s.onerror=()=>{ delete loaded[src]; bad(new Error("Internetdan yuklab bo'lmadi: "+src.split("/")[2])) }; document.head.append(s) }) }
async function pdfCanvases(buf, maxPages){
  const lib = await import(PDFJS); lib.GlobalWorkerOptions.workerSrc = PDFW;
  const pdf = await lib.getDocument({data:new Uint8Array(buf)}).promise; const out=[];
  for (let p=1; p<=Math.min(pdf.numPages, maxPages); p++){ const pg=await pdf.getPage(p); const v1=pg.getViewport({scale:1}); const vp=pg.getViewport({scale:2400/v1.width});
    const cv=document.createElement("canvas"); cv.width=Math.round(vp.width); cv.height=Math.round(vp.height); const ctx=cv.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx, canvas:cv, viewport:vp}).promise; invertDark(cv); out.push(cv) }
  return out;
}
// to'q fondagi oq yozuvli qatorlarni (jadval sarlavhasi) teskari rangga o'girish: aks holda o'qilmaydi
function invertDark(cv){
  const ctx=cv.getContext("2d"); const W=cv.width, H=cv.height; const im=ctx.getImageData(0,0,W,H); const d=im.data;
  const a=Math.round(W*0.1), b=Math.round(W*0.9);
  for (let y=0;y<H;y++){ let s=0; const o=y*W*4; for (let x=a;x<b;x+=4){ const i=o+x*4; s+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2] }
    const g=v=>0.299*d[v]+0.587*d[v+1]+0.114*d[v+2];
    const dark = s/((b-a)/4) < 110;
    for (let x=0;x<W;x++){ const i=o+x*4; let L=g(i); if (dark) L=255-L; d[i]=d[i+1]=d[i+2]=L } }
  ctx.putImageData(im,0,0);
}
let worker=null;
async function ocrWords(canvas){
  if (!worker){ await loadScript(TESS); worker = await G.Tesseract.createWorker("rus+eng", 1); await worker.setParameters({preserve_interword_spaces:"1"}) }
  const {data} = await worker.recognize(canvas);
  return (data.words||[]).map(w=>({t:w.text, x0:w.bbox.x0, y0:w.bbox.y0, x1:w.bbox.x1, y1:w.bbox.y1, c:w.confidence}));
}
// file -> {order, mato}; step(text) shows progress
SITE.readZakazPdf = async (file, step=()=>{}, known=[]) => {
  step("PDF ochilmoqda…");
  const cvs = await pdfCanvases(await file.arrayBuffer(), 4);
  let order=null, mato=null;
  for (let i=0;i<cvs.length && !(order && mato);i++){
    step(`${i+1}-sahifa o'qilmoqda (birinchi marta 20–40 soniya)…`);
    const ws = await ocrWords(cvs[i]);
    if (!order){ const o=parseOrderPage(ws); if (o && o.colours.length){ order=o; continue } }
    if (!mato){ const m=parseMatoPage(ws); if (m && m.lines.length) mato=m }
  }
  // ranglar: bazadagi ma'lum nomlarga, 2-sahifani 1-sahifadagi nomlarga moslash
  if (order) for (const r of order.colours) r.name = matchColour(r.name, known);
  if (mato){ const ref=[...(order?order.colours.map(r=>r.name):[]), ...known];
    const mainCs=[...new Set(mato.lines.filter(l=>l.t!=="Ribana").map(l=>l.c))];
    const map=new Map(mainCs.map((c,i)=>{ const m=matchColour(c, ref); return [c, m!==c ? m : (order && order.colours.length===mainCs.length ? order.colours[i].name : c)] }));
    for (const l of mato.lines) l.c = map.get(l.c) || matchColour(l.c, ref) }
  return {order, mato};
};
SITE.pdfParse = {parseOrderPage, parseMatoPage, toLines, matchColour};
if (typeof module!=="undefined") module.exports = SITE.pdfParse;
})();
</script>
<script>/* ================= SAYT: Supabase, login, rollar, pechat, tarozi ================= */
(function(){
const CFG = window.SITE_CONFIG || {};
const DOMAIN = "aksarteks.app";
const PERMS = [
  ["zakazlar","Zakazlarni ko'rish"], ["zakaz","Zakaz qo'shish, o'zgartirish, o'chirish"],
  ["kiritish:kroy","Kiritish: Kroy"], ["kiritish:patok","Kiritish: Patok"], ["kiritish:tikuv","Kiritish: Tikuv"], ["kiritish:brak","Kiritish: Brak"], ["kiritish:sklad","Kiritish: Sklad (qo'lda)"], ["kiritish:otgr","Kiritish: Jo'natildi (qo'lda)"], ["jonatish","Sklad: furaga yuklash (jo'natish)"],
  ["upak","Upakovka"], ["sklad","Sklad (ko'rish)"], ["fura","Fura yuklash"], ["sozlamalar","Sozlamalar"], ["users","Xodimlar va rollar"],
  ["mato","Mato ombori"], ["pachka","Tikuv: pachka va stiker"], ["skaner","Tikuv: stiker skanerlash"], ["oylik","Tikuv: oylik hisobi"], ["monitor","Tikuv: monitoring"], ["ishchi","Tikuv: ishchilar va narxlar"],
];
const SB = window.supabase && CFG.url ? window.supabase.createClient(CFG.url, CFG.key) : null;
const SITE = window.SITE;
SITE.sb = SB;
SITE.viewOk = v => v==="profil" ? true : v==="users" ? SITE.can("users") : v==="tikuv" ? SITE.tkOk() : v==="mato" ? SITE.matoOk() : v==="zaxira" ? SITE.can("*") : true;
const email = login => `${String(login).trim().toLowerCase().replace(/[^a-z0-9._-]/g,"")}@${DOMAIN}`;
let me=null, profile=null, profiles=new Map(), roles=new Map();

/* ---------- db adapter: same shape the app already uses ---------- */
const colInfo = path => { const p=path.split("/"); if (p.length===1) return {table:p[0]}; if (p.length===3 && p[2]==="moves") return {table:"moves", order:p[1]}; throw new TypeError("path "+path) };
const docInfo = path => { const p=path.split("/"); const id=p.pop(); return {...colInfo(p.join("/")), id} };
// moves share one table, so a move's row id carries its order id
const rid = (order,id) => order ? order+"__"+id : id;
const uid = (order,rowId) => order && String(rowId).startsWith(order+"__") ? String(rowId).slice(order.length+2) : rowId;
const snapDoc = (id,data) => ({id, exists:data!=null, data:()=>data==null?undefined:data, metadata:{fromCache:false,hasPendingWrites:false}});
const dbErr = e => ({code: (e && (e.code==="42501" || /row-level security|permission/i.test(e.message||""))) ? "invalid_argument" : "unavailable", message:(e&&e.message)||String(e)});
const listeners = new Set();
function notify(table, order, id, data){ for (const L of listeners) if (L.table===table && (L.order||"")===(order||"")) { if (data==null) L.cache.delete(id); else L.cache.set(id,data); L.emit() } }
async function fetchAll(table, order){
  let out=[], from=0;
  for(;;){ let q=SB.from(table).select("id,data"); if (order) q=q.eq("order_id",order);
    const {data,error}=await q.order("id").range(from,from+999); if (error) throw dbErr(error);
    out=out.concat(data||[]); if (!data || data.length<1000) break; from+=1000 }
  return out.map(r=>({id:uid(order,r.id), data:r.data}));
}
function colRef(path){
  const {table, order}=colInfo(path);
  const ref = {
    path,
    doc(id){ return docRef(path+"/"+(id || ("m"+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))) },
    async get(){ const rows=await fetchAll(table,order); const docs=rows.map(r=>snapDoc(r.id,r.data)); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}} },
    onSnapshot(fn, errFn){
      const L={table, order, cache:new Map(), alive:true};
      L.emit=()=>{ if (!L.alive) return; const docs=[...L.cache.entries()].sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([id,d])=>snapDoc(id,d)); fn({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}) };
      L.refresh=async()=>{ try{ const rows=await fetchAll(table,order); L.cache=new Map(rows.map(r=>[r.id,r.data])); L.emit() }catch(e){ errFn && errFn(e) } };
      listeners.add(L);
      const opt={event:"*", schema:"public", table}; if (order) opt.filter=`order_id=eq.${order}`;

function docRef(path){
  const {table, order, id}=docInfo(path);
  const R = rid(order,id);
  const cur = async()=>{ const {data,error}=await SB.from(table).select("id,data").eq("id",R).maybeSingle(); if (error) throw dbErr(error); return data?data.data:null };
  return {
    id, path,
    async get(){ return snapDoc(id, await cur()) },
    async set(d){ const row={id:R, data:d}; if (table==="orders"||table==="moves") row.updated_at=new Date().toISOString(); if (order) row.order_id=order;
      const {error}=await SB.from(table).upsert(row); if (error) throw dbErr(error); notify(table,order,id,d) },
    async update(d){ const c=await cur(); if (c==null) throw {code:"invalid_argument",message:"not found"}; const m={...c,...d};
      const patch={data:m}; if (table==="orders"||table==="moves") patch.updated_at=new Date().toISOString();
      const {error}=await SB.from(table).update(patch).eq("id",R); if (error) throw dbErr(error); notify(table,order,id,m) },
    async delete(){ const {error}=await SB.from(table).delete().eq("id",R); if (error) throw dbErr(error); notify(table,order,id,null) },
    onSnapshot(fn, errFn){ return colRef(path.split("/").slice(0,-1).join("/")).onSnapshot(s=>{ const d=s.docs.find(x=>x.id===id); fn(snapDoc(id, d?d.data():null)) }, errFn) },
    collection(c){ return colRef(path+"/"+c) },
  };
}

const SC = { port:null, val:null, stable:false, hist:[], armed:true, status:"off", baud:Number(pref.get("sc_baud","9600")), cmd:pref.get("sc_cmd",""), auto:pref.get("sc_auto","0")==="1", onW:null, onSave:null, timer:null };

  const st = SC.hist.length>=4 && Math.max(...SC.hist)-Math.min(...SC.hist) <= 0.02;
  SC.stable=st; paintScale();
  if (st && SC.onW && v>0.05) SC.onW(Math.round(v*100)/100);
  if (v<0.2) SC.armed=true;
  if (st && SC.auto && SC.armed && SC.onSave && v > (Number(S.up?.tare)||0)+0.1){ SC.armed=false; SC.onSave() }
}

  if (SC.timer) clearInterval(SC.timer);
  if (SC.cmd){ const w=port.writable.getWriter(); const cmd=SC.cmd.replace(/\\r/g,"\r").replace(/\\n/g,"\n"); SC.timer=setInterval(()=>{ w.write(new TextEncoder().encode(cmd)).catch(()=>{}) },400) }
  (async()=>{ const dec=new TextDecoderStream(); port.readable.pipeTo(dec.writable).catch(()=>{}); const rd=dec.readable.getReader(); let buf="";
    try{ for(;;){ const {value,done}=await rd.read(); if (done) break; buf+=value; const parts=buf.split(/[\r\n]+/); buf=parts.pop(); for (const l of parts){ const v=scaleParse(l); if (v!=null) scaleFeed(v) } } }
    catch(e){} SC.status="off"; SC.port=null; paintScale() })();
}

const ZX_TABLES = ["roles","profiles","orders","moves","settings","workers","tmodels","packs","scans","workdays","box_counters","box_nums"];
const ZX_T = {roles:"Rol",profiles:"Xodim",orders:"Zakaz",moves:"Harakat",settings:"Sozlama",workers:"Ishchi",tmodels:"Tikuv modeli",packs:"Pachka",scans:"Skan",workdays:"Ish kunlari",box_counters:"Korobka sanog'i",box_nums:"Korobka raqami"};
const ZX_ST = {kroy:"Kroy",patok:"Patok",tikuv:"Tikuv",brak:"Brak",sklad:"Sklad",otgr:"Jo'natildi",mato_in:"Mato kirim",mato_out:"Mato bichuvga",mato_brak:"Mato brak"};
const zxNoSql = e => /function|does not exist|schema cache|relation/i.test((e&&e.message)||"");
const zxDate = s => { if (!s) return ""; const d=new Date(s); return d.toLocaleDateString("ru-RU")+" "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}) };
const zxDays = s => s ? Math.floor((Date.now()-new Date(s).getTime())/86400000) : null;
async function zxMeta(){ const r=await SB.from("app_meta").select("*").eq("k","backup").maybeSingle(); if (r.error) throw r.error; return r.data }
function zxDesc(x){
  const d=x.data||{}, v=d.data||{};
  const oc = id => { const o=id && S.orders && S.orders.get && S.orders.get(id); return o ? o.code : (id||"").replace(/^o-/,"") };
  if (x.tbl==="orders") return `${v.code||oc(x.row_id)}${v.customer?" · "+v.customer:""}${(v.models||[]).length?" · "+v.models.join(", "):""}`;
  if (x.tbl==="moves"){ const q=(v.items||[]).reduce((a,i)=>a+(Number(i.qty)||Number(i.kg)||0),0);
    return `${oc(x.order_id)} · ${T(ZX_ST[v.stage]||v.stage||"")}${v.label?" · "+v.label:""}${v.date?" · "+v.date:""}${q?" · "+Math.round(q*10)/10:""}` }
  if (x.tbl==="packs") return `№${d.id} · ${d.order_code||""} · ${[d.m,d.c,d.r].filter(Boolean).join(" ")} · ${d.qty} dona`;
  if (x.tbl==="scans") return `${d.code} · ${d.worker} · ${d.op_name||""} · ${d.qty} dona`;
  if (x.tbl==="workers") return `${d.id} · ${d.name||""}`;
  if (x.tbl==="tmodels"||x.tbl==="roles") return d.name||x.row_id;
  return x.row_id||"";
}

    catch(e){ Z.err=zxNoSql(e) ? "nosql" : (e.message||String(e)); Z.list=Z.list||[] }

  if (Z.err==="nosql"){ main.append(h("div",{class:"banner"},"Bazaga zaxira.sql hali qo'shilmagan. Supabase → SQL Editor'da zaxira.sql faylini bir marta ishga tushiring.")); return }

      h("button",{class:"btn primary",type:"button",disabled:!!Z.busy,onclick:zxBackup}, Z.busy && Z.busy.startsWith("b") ? "Yuklanmoqda…" : "Zaxira nusxani yuklab olish")),
    Z.busy && h("div",{class:"muted"}, Z.busy.slice(2)))));
  // restore
  const F=Z.file;
  main.append(h("section",{class:"panel"}, h("div",{class:"ph"},h("h2",{},"Zaxiradan tiklash")), h("div",{class:"pb"},
    h("p",{class:"muted",style:"margin:0"},"Fayldagi yozuvlar bazaga qaytariladi: bazada bor yozuv fayldagi holatiga qaytadi, yo'qolgani qayta yoziladi. Zaxiradan keyin qo'shilgan yozuvlar o'chirilmaydi."),
    !F ? h("label",{class:"drop"}, h("input",{type:"file",accept:".json",onchange:e=>{ if (e.target.files[0]) zxPick(e.target.files[0]) }}), h("span",{class:"btn"},"Zaxira faylini tanlash"))
    : h("div",{style:"display:grid;gap:8px"},
        h("div",{}, h("b",{},document.createTextNode(F.name)), " · ", document.createTextNode(`${zxDate(F.j.at)} · ${T(F.total+" ta yozuv")}`)),
        h("div",{class:"chips"}, ZX_TABLES.filter(t=>(F.j.tables[t]||[]).length).map(t=>h("span",{class:"chip"}, `${T(ZX_T[t])}: ${F.j.tables[t].length}`))),
        h("div",{class:"row"},
          F.sure ? h("span",{class:"status err"},"Ishonchingiz komilmi? Bazadagi yozuvlar fayldagi holatga qaytadi.") : "",
          h("span",{class:"spacer"}),

                 : h("button",{class:"btn primary",type:"button",onclick:()=>{ F.sure=true; render() }},"Tiklash")),

  // deleted log

    h("td",{class:"mono"}, document.createTextNode(x.by_login||"")),
    h("td",{}, x.restored_at ? h("span",{class:"muted"}, document.createTextNode(`${T("qaytarildi")} ${zxDate(x.restored_at)}${x.restored_by?" · "+x.restored_by:""}`))
      : h("button",{class:"btn quiet small",type:"button",onclick:()=>zxUndo(x)},"Qaytarish"))));
  main.append(h("section",{class:"panel"}, h("div",{class:"ph"},h("h2",{},"O'chirilganlar"), h("span",{class:"muted"}, (Z.list||[]).length+" ta"), h("span",{class:"spacer"}),
      h("select",{onchange:e=>{ Z.filter=e.target.value; render() }}, h("option",{value:""},"Hammasi"), used.map(t=>h("option",{value:t,selected:Z.filter===t},ZX_T[t]||t)))),

    L.length ? h("div",{class:"tbox",style:"border:0"}, h("table",{}, h("thead",{},h("tr",{}, ["Qachon","Nima","Tafsilot","Kim",""].map(t=>h("th",{},t)))), tb))
      : h("div",{class:"empty"}, Z.list===null ? "Yuklanmoqda…" : "Hali hech narsa o'chirilmagan")));
};
async function zxBackup(){
  const Z=SITE.zx; const out={app:"aksarteks-zaxira", v:1, at:new Date().toISOString(), by:profile&&profile.login, tables:{}}; let total=0;
  try{
    for (const t of ZX_TABLES){ Z.busy="b:"+T(ZX_T[t])+"…"; render();
      const {data,error}=await SB.rpc("backup_table",{p_tbl:t}); if (error) throw error; if (data!=null){ out.tables[t]=data; total+=data.length } }
    const txt=JSON.stringify(out); const d=new Date(); const p=n=>String(n).padStart(2,"0");
    await downloads.save({filename:`aksarteks-zaxira-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`, data:new Blob([txt],{type:"application/json"})});
    await SB.rpc("backup_mark",{p_info:{rows:total, bytes:txt.length}});
    Z.meta=await zxMeta(); toast(`Zaxira nusxa yuklandi: ${total} ta yozuv`);
  }catch(e){ toast(zxNoSql(e)?"Bazaga zaxira.sql hali qo'shilmagan.":"Zaxira xatosi: "+(e.message||e),true) }
  Z.busy=""; render();
}
async function zxPick(file){
  try{ const j=JSON.parse(await file.text()); if (j.app!=="aksarteks-zaxira" || !j.tables) throw new Error("Bu fayl zaxira nusxa emas");
    SITE.zx.file={name:file.name, j, total:Object.values(j.tables).reduce((a,r)=>a+(r||[]).length,0), sure:false} }
  catch(e){ toast("Faylni o'qib bo'lmadi: "+(e.message||e),true) }
  render();
}
async function zxRestore(){
  const Z=SITE.zx, F=Z.file; let n=0;
  try{
    for (const t of ZX_TABLES){ const rows=F.j.tables[t]||[];
      for (let i=0;i<rows.length;i+=300){ Z.busy=`r:${T(ZX_T[t])}: ${Math.min(i+300,rows.length)} / ${rows.length}`; render();
        const {data,error}=await SB.rpc("restore_rows",{p_tbl:t, p_rows:rows.slice(i,i+300)}); if (error) throw error; n+=data||0 } }
    Z.file=null; toast(`Tiklandi: ${n} ta yozuv`);
    if (SITE.tk){ SITE.tk.workers=null; SITE.tk.models=null; SITE.tk._workers=false; SITE.tk._models=false }
    await loadPeople(); for (const L of listeners) L.refresh();
  }catch(e){ toast("Tiklash xatosi: "+(e.message||e),true) }
  Z.busy=""; render();
}
async function zxUndo(x){
  const {data,error}=await SB.rpc("undelete",{p_id:x.id});
  if (error){ toast(error.message||String(error),true); return }
  toast(`Qaytarildi: ${data} ta yozuv`);
  for (const L of listeners) L.refresh(); if (x.tbl==="profiles"||x.tbl==="roles") await loadPeople();
  if (SITE.tk){ SITE.tk.workers=null; SITE.tk.models=null; SITE.tk._workers=false; SITE.tk._models=false }
  SITE.zx.meta=undefined; render();
}
async function zxRemind(){
  if (!SITE.can("*")) return;
  try{ const m=await zxMeta(); const d=m?zxDays(m.at):null;
    if (m===null) toast("Zaxira nusxa hali olinmagan. «Zaxira» bo'limidan yuklab oling.", true);
    else if (d>7) toast(`Oxirgi zaxira nusxa ${d} kun oldin olingan. «Zaxira» bo'limidan yangisini yuklab oling.`, true);
  }catch(e){}
}
SITE.views.profil = main => {

/* ---------- login screen ---------- */
function loginScreen(firstRun, msg){
  const wrap=document.createElement("div"); wrap.id="login";
  const L=window.__LANG?window.__LANG():"uz";
  wrap.innerHTML=`<form class="lg-card" autocomplete="on">
    <div class="row" style="justify-content:space-between"><div class="brand"><small>Aksarteks Industry</small><b>${T("Zakaz harakati")}</b></div>
      <select id="lg_lang" aria-label="Til / Язык / Language" style="font:inherit;font-size:13px;padding:4px 6px"><option value="uz"${L==="uz"?" selected":""}>O'zbekcha</option><option value="ru"${L==="ru"?" selected":""}>Русский</option><option value="en"${L==="en"?" selected":""}>English</option></select></div>
    <h1>${T(firstRun?"Birinchi kirish":"Kirish")}</h1>
    ${firstRun?'<p class="muted">'+T("Bazada hali hech kim yo'q. Rahbar hisobini yarating: keyin xodimlarni shu hisobdan qo'shasiz.")+'</p>':""}
    ${firstRun?'<label class="f">'+T("Ism familiya")+'<input id="lg_name" required></label>':""}
    <label class="f">${T("Login")}<input id="lg_login" autocomplete="username" required autocapitalize="none"></label>
    <label class="f">${T("Parol")}<input id="lg_pass" type="password" autocomplete="${firstRun?"new-password":"current-password"}" required></label>
    <p class="status err" id="lg_err">${msg?T(msg):""}</p>
    <button class="btn primary" type="submit">${T(firstRun?"Hisobni yaratish":"Kirish")}</button></form>`;
  wrap.querySelector("#lg_lang").addEventListener("change",e=>{ window.__setLang(e.target.value); const ls=document.getElementById("langSel"); if (ls) ls.value=e.target.value; wrap.remove(); loginScreen(firstRun,msg) });
  document.body.append(wrap);
  wrap.querySelector("form").addEventListener("submit", async e=>{ e.preventDefault();
    const login=wrap.querySelector("#lg_login").value.trim().toLowerCase(), pass=wrap.querySelector("#lg_pass").value, er=wrap.querySelector("#lg_err");
    er.textContent="";
    try{
      if (firstRun){ const name=wrap.querySelector("#lg_name").value.trim();
        if (pass.length<6) throw new Error("Parol kamida 6 belgi bo'lsin.");
        let r=await SB.auth.signUp({email:email(login), password:pass}); if (r.error) throw r.error;
        if (!r.data.session){ r=await SB.auth.signInWithPassword({email:email(login), password:pass}); if (r.error) throw r.error }
        const c=await SB.rpc("claim_admin",{p_login:login, p_name:name||login}); if (c.error) throw c.error;
      } else {
        const r=await SB.auth.signInWithPassword({email:email(login), password:pass}); if (r.error) throw new Error("Login yoki parol noto'g'ri.");
      }
      wrap.remove(); boot();
    }catch(err){ er.textContent = /confirm/i.test(err.message||"") ? T("Supabase'da \"Confirm email\" o'chirilmagan.") : T(err.message||String(err)) }
  });
}

async function boot(){
  if (!SB){ document.getElementById("main").innerHTML='<div class="banner">Sayt sozlanmagan: Supabase manzili va kaliti yozilmagan.</div>'; return }
  const {data:{session}}=await SB.auth.getSession();
  if (!session){ const ae=await SB.rpc("admin_exists"); loginScreen(ae.data===false); return }
  me=session.user;
  await loadPeople();
  if (!profile){ const ae=await SB.rpc("admin_exists"); if (ae.data===false){ await SB.rpc("claim_admin",{p_login:me.email.split("@")[0], p_name:me.email.split("@")[0]}); await loadPeople() } }
  if (!profile || !profile.active || !SITE.perms.size){ document.getElementById("main").innerHTML='<div class="banner">'+T("Hisobingizga hali ruxsat berilmagan yoki bloklangan. Rahbarga murojaat qiling.")+'</div>'; addNav(); return }
  SB.channel("people").on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadPeople().then(render)).on("postgres_changes",{event:"*",schema:"public",table:"roles"},()=>loadPeople().then(render)).subscribe();
  window.claude = { use: async n => ({db, user, downloads})[n] || null };
  addNav();
  if (["profil","users","zaxira"].includes(S.view)) S.view="list";
  startApp();
  setTimeout(zxRemind, 4000);
}
function addNav(){
  const nav=document.querySelector("nav");
  if (SITE.addTikuvNav) SITE.addTikuvNav();
  if (SITE.addMatoNav) SITE.addMatoNav();
  if (!nav.querySelector('[data-view="users"]')){
    for (const [v,t] of [["zaxira","Zaxira"],["users","Xodimlar"],["profil", profile ? (profile.name||profile.login) : "Profil"]]){
      const b=document.createElement("button"); b.type="button"; b.dataset.view=v; b.textContent=t; b.addEventListener("click",()=>setView(v)); nav.append(b) }
  }
}
boot();
})();
